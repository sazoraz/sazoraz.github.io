<script>
(function(){

var R=window.SRR,$=function(i){return document.getElementById(i)};

function merge(a,b){if(Array.isArray(b))return b;if(b&&typeof b==='object'&&a&&typeof a==='object'&&!Array.isArray(a)){var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=(k in a)?merge(a[k],b[k]):b[k];return o}return b===undefined?a:b}
function J(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}}

/* ---------- تنظیمات ---------- */
var S=clone(R.DEFAULTS);

fetch('/data/site.config.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).then(function(c){if(c)S=merge(clone(R.DEFAULTS),c)}).catch(function(){});

/* ---------- گیت‌هاب ---------- */
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function ub64(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}
function GH(){var g=gh();if(!g.o||!g.r||!g.t)throw new Error('اطلاعات گیت‌هاب (نام کاربری، ریپازیتوری، توکن) را در مرحلهٔ اول پر کن.');g.b=g.b||'main';return g}
function H(g){return{Authorization:'Bearer '+g.t,Accept:'application/vnd.github+json'}}
function U(g,p){return'https://api.github.com/repos/'+g.o+'/'+g.r+'/contents/'+p.split('/').map(encodeURIComponent).join('/')}
async function getF(g,p){var r=await fetch(U(g,p)+'?ref='+encodeURIComponent(g.b)+'&t='+Date.now(),{headers:H(g),cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error(p+' → '+r.status);return r.json()}
async function putF(g,p,c64,msg){
  var cur=await getF(g,p);
  var w=await fetch(U(g,p),{method:'PUT',headers:H(g),body:JSON.stringify({message:msg||('update '+p),content:c64,branch:g.b,sha:cur?cur.sha:undefined})});
  if(!w.ok)throw new Error(p+' → '+w.status+' '+((await w.json().catch(function(){return{}})).message||''));
}
async function readIndex(g){var f=await getF(g,'data/posts.json');if(!f)return[];try{return JSON.parse(ub64(f.content)).posts||[]}catch(e){return[]}}
async function writeIndex(g,posts){posts.sort(function(a,b){return String(b.date).localeCompare(String(a.date))});await putF(g,'data/posts.json',b64(JSON.stringify({posts:posts.slice(0,300)},null,1)),'import: posts index')}
function pageList(posts){
  var u=S.site.url.replace(/\/$/,''),x=['/','/shop/','/tuner/'].concat(Object.keys(R.CATS).filter(function(c){return c!=='extra'}).map(function(c){return R.CATS[c].dir}));
  var s='<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
  x.forEach(function(p){s+='<url><loc>'+u+p+'</loc></url>\n'});
  posts.forEach(function(p){s+='<url><loc>'+u+p.href+'</loc>'+(p.date?'<lastmod>'+p.date+'</lastmod>':'')+'</url>\n'});
  return s+'</urlset>\n';
}

/* ---------- گرفتن از سایت قدیم (مستقیم یا از طریق ورکر) ---------- */
function workerApi(){return (S.site.api||R.DEFAULTS.site.api||'').replace(/\/$/,'')}
async function fetchOld(url,asBlob){
  var err;
  try{var r=await fetch(url,{cache:'no-store'});if(r.ok)return r;err=new Error('خطای '+r.status)}catch(e){err=e}
  if(AI.pk&&workerApi()){
    try{var r2=await fetch(workerApi()+'/api/wpfetch?u='+encodeURIComponent(url),{headers:{'X-Proxy-Key':AI.pk}});if(r2.ok)return r2;err=new Error('ورکر: خطای '+r2.status)}catch(e){err=e}
  }
  throw err;
}
function normRest(p,cm){
  var emb=(p._embedded&&p._embedded['wp:featuredmedia']&&p._embedded['wp:featuredmedia'][0])||{},y=p.yoast_head_json||{};
  return{id:String(p.id),date:p.date,modified:p.modified,slug:safeDec(p.slug),link:p.link,title:dec(p.title&&p.title.rendered),html:(p.content&&p.content.rendered)||'',excerpt:plain(p.excerpt&&p.excerpt.rendered),
    cats:(p.categories||[]).map(function(i){return cm[i]||('دستهٔ '+i)}),img:emb.source_url||'',imgAlt:emb.alt_text||'',seoTitle:cleanTitle(y.title||''),seoDesc:y.description||'',kw:''};
}
function safeDec(s){try{return decodeURIComponent(s)}catch(e){return s}}
function cleanTitle(t){return dec(t).replace(/\s*[-–|»]\s*[^-–|»]{2,40}$/,'').trim()}
async function loadRest(){
  var base=IM.base.replace(/\/$/,'');log('در حال گرفتن دسته‌ها...');
  var cm={};
  try{var cr=await fetchOld(base+'/wp-json/wp/v2/categories?per_page=100&_fields=id,name');(await cr.json()).forEach(function(c){cm[c.id]=dec(c.name)})}catch(e){log('دسته‌ها گرفته نشد: '+e.message,true)}
  var out=[],page=1;
  for(;;){
    log('در حال گرفتن مقاله‌ها... (صفحه '+page+'، تا اینجا '+out.length+')');
    var r;try{r=await fetchOld(base+'/wp-json/wp/v2/posts?per_page=20&page='+page+'&status=publish&_embed=wp:featuredmedia')}catch(e){if(page>1)break;throw e}
    var arr=await r.json();if(!Array.isArray(arr)||!arr.length)break;
    arr.forEach(function(p){out.push(normRest(p,cm))});
    var tp=parseInt(r.headers.get('X-WP-TotalPages')||'0',10);if(arr.length<20||(tp&&page>=tp))break;page++;
  }
  return out;
}
function loadXml(text){
  var d=new DOMParser().parseFromString(text,'text/xml');if(d.querySelector('parsererror'))throw new Error('فایل XML معتبر نیست.');
  var q=function(el,sel){var n=el.getElementsByTagName(sel)[0];return n?n.textContent:''};
  var items=[].slice.call(d.getElementsByTagName('item')),att={},posts=[];
  items.forEach(function(it){if(q(it,'wp:post_type')==='attachment')att[q(it,'wp:post_id')]={url:q(it,'wp:attachment_url'),alt:''}});
  items.forEach(function(it){
    if(q(it,'wp:post_type')!=='post'||q(it,'wp:status')!=='publish')return;
    var meta={};[].slice.call(it.getElementsByTagName('wp:postmeta')).forEach(function(m){meta[q(m,'wp:meta_key')]=q(m,'wp:meta_value')});
    var cats=[].slice.call(it.getElementsByTagName('category')).filter(function(c){return c.getAttribute('domain')==='category'}).map(function(c){return dec(c.textContent)});
    var th=att[meta._thumbnail_id]||{};
    posts.push({id:q(it,'wp:post_id'),date:(q(it,'wp:post_date')||'').replace(' ','T'),modified:(q(it,'wp:post_modified')||'').replace(' ','T'),slug:safeDec(q(it,'wp:post_name')),link:q(it,'link'),title:dec(q(it,'title')),html:q(it,'content:encoded'),excerpt:plain(q(it,'excerpt:encoded')),cats:cats.length?cats:['بدون دسته'],img:th.url||'',imgAlt:'',seoTitle:meta._yoast_wpseo_title&&!/%%/.test(meta._yoast_wpseo_title)?meta._yoast_wpseo_title:'',seoDesc:meta._yoast_wpseo_metadesc||'',kw:meta._yoast_wpseo_focuskw||''});
  });
  return posts;
}

/* ---------- تبدیل HTML وردپرس به بلوک ---------- */
function inline(n){
  var s='';
  n.childNodes.forEach(function(c){
    if(c.nodeType===3){s+=c.nodeValue;return}
    if(c.nodeType!==1)return;var t=c.tagName.toLowerCase();
    if(t==='br'){s+='\n';return}
    if(t==='script'||t==='style'||t==='img'||t==='iframe')return;
    var inner=inline(c);
    if(t==='a'){var h=c.getAttribute('href')||'';s+=(h&&/^(https?:|\/)/.test(h)&&inner.trim())?'['+inner.trim()+']('+h+')':inner;return}
    if(t==='strong'||t==='b'){s+=inner.trim()?'**'+inner.trim()+'** ':inner;return}
    s+=inner;
  });
  return s;
}
function imgSrc(i){return i.getAttribute('data-src')||i.getAttribute('data-lazy-src')||i.getAttribute('src')||''}
function toBlocks(html){
  html=String(html||'').replace(/\[\/?caption[^\]]*\]/g,'').replace(/<!--[\s\S]*?-->/g,'');
  var d=document.createElement('div');d.innerHTML=html;d.querySelectorAll('script,style,noscript').forEach(function(x){x.remove()});
  var out=[],warn=[];
  function para(t){t=t.replace(/[ \t]+/g,' ').replace(/ ?\n ?/g,'\n').trim();if(t)out.push({t:'paragraph',text:t})}
  function media(el){
    var src=el.getAttribute('src')||el.getAttribute('data-src')||'';
    if(/youtu\.?be/.test(src)){var m=/embed\/([\w-]{6,})/.exec(src)||/v=([\w-]{6,})/.exec(src);out.push({t:'video',url:'https://www.youtube.com/watch?v='+(m?m[1]:''),title:el.getAttribute('title')||''});return}
    if(/aparat\.com/.test(src)){var a=/\/(?:v|embed)\/([\w]+)/.exec(src);out.push({t:'aparat',url:a?'https://www.aparat.com/v/'+a[1]:src,title:el.getAttribute('title')||''});return}
    if(/soundcloud\.com/.test(src)){var u=/[?&]url=([^&]+)/.exec(src);out.push({t:'soundcloud',url:u?decodeURIComponent(u[1]):src,title:el.getAttribute('title')||''});return}
    out.push({t:'embed',code:el.outerHTML,height:el.getAttribute('height')||360,title:el.getAttribute('title')||'محتوای تعاملی'});warn.push('یک iframe ناشناس به‌صورت «کد» منتقل شد');
  }
  function walk(n){
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){var tx=c.nodeValue.trim();if(tx)para(tx);return}
      if(c.nodeType!==1)return;var t=c.tagName.toLowerCase();
      if(/^h[1-6]$/.test(t)){var ht=plain(c.innerHTML);if(ht)out.push({t:'heading',level:(t==='h1'||t==='h2')?2:3,text:ht});return}
      if(t==='p'){
        var imgs=c.querySelectorAll('img'),txt=inline(c).trim();
        if(!imgs.length){if(txt)para(txt);return}
        if(txt.length>2){para(txt)}
        imgs.forEach(function(i){var s=imgSrc(i);if(s)out.push({t:'image',src:s,alt:i.getAttribute('alt')||'',caption:''})});
        return}
      if(t==='img'){var s2=imgSrc(c);if(s2)out.push({t:'image',src:s2,alt:c.getAttribute('alt')||'',caption:''});return}
      if(t==='figure'){
        var im=c.querySelector('img'),fc=c.querySelector('figcaption'),fr=c.querySelector('iframe');
        if(im){out.push({t:'image',src:imgSrc(im),alt:im.getAttribute('alt')||'',caption:fc?plain(fc.innerHTML):''});return}
        if(fr){media(fr);return}
        walk(c);return}
      if(t==='ul'||t==='ol'){var li=[].slice.call(c.children).map(function(x){return inline(x).replace(/\s+/g,' ').trim()}).filter(Boolean);if(li.length)out.push({t:'list',text:li.join('\n')});return}
      if(t==='blockquote'){var q=inline(c).trim();if(q)out.push({t:'highlight',label:'نکته',text:q});return}
      if(t==='hr'){out.push({t:'divider'});return}
      if(t==='iframe'){media(c);return}
      if(t==='audio'){var as=c.getAttribute('src')||(c.querySelector('source')||{getAttribute:function(){return''}}).getAttribute('src');if(as)out.push({t:'audio',src:as,title:'',dl:true});return}
      if(t==='video'){warn.push('یک ویدیوی مستقیم (video) پیدا شد؛ دستی اضافه‌اش کن');return}
      if(t==='table'){out.push({t:'embed',code:'<div style="overflow:auto;font-family:Tahoma,sans-serif;direction:rtl"><style>table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:6px}</style>'+c.outerHTML+'</div>',height:320,title:'جدول'});warn.push('یک جدول به‌صورت «کد» منتقل شد');return}
      if(t==='pre'){var pt=c.textContent.trim();if(pt)para(pt);return}
      if(t==='a'&&/\.mp3(\?|$)/i.test(c.getAttribute('href')||'')){out.push({t:'audio',src:c.getAttribute('href'),title:plain(c.innerHTML),dl:true});return}
      if(t==='a'&&/wp-block-button|button|btn/.test(c.className||'')){out.push({t:'button',label:plain(c.innerHTML),href:c.getAttribute('href')||'',note:''});return}
      if(t==='a'||t==='span'||t==='strong'||t==='b'||t==='em'||t==='i'){var it=inline({childNodes:[c]}).trim();if(it)para(it);return}
      walk(c);
    });
  }
  walk(d);
  out.forEach(function(b){b.id=bid()});
  /* مرج پاراگراف‌های پشت‌سرهم کوتاه نمی‌شود؛ هر بلوک همان‌طور که در منبع بود می‌ماند */
  return{blocks:out,warn:warn};
}

/* ---------- تصویر ---------- */
function absUrl(u){try{return new URL(u,IM.base).href}catch(e){return u}}
function shrink(blob){return new Promise(function(res){var img=new Image(),u=URL.createObjectURL(blob);img.onload=function(){var r=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);res(b||blob)},'image/webp',.8)};img.onerror=function(){URL.revokeObjectURL(u);res(blob)};img.src=u})}
async function toB64(blob){var buf=await blob.arrayBuffer(),bin='',u8=new Uint8Array(buf);for(var i=0;i<u8.length;i+=8192)bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(bin)}
async function moveImage(g,url,slug,n,cache){
  url=absUrl(url);if(cache[url])return cache[url];
  var r=await fetchOld(url,true),blob=await r.blob(),ty=(blob.type||'').toLowerCase(),ext='jpg';
  if(/gif/.test(ty)||/\.gif(\?|$)/i.test(url)){ext='gif'}else if(/svg/.test(ty)||/\.svg(\?|$)/i.test(url)){ext='svg'}
  else{blob=await shrink(blob);ext=/webp/.test(blob.type)?'webp':/png/.test(blob.type)?'png':'jpg'}
  var path='assets/img/'+slug+'/'+n+'.'+ext;
  await putF(g,path,await toB64(blob),'import image '+path);
  cache[url]='/'+path;return cache[url];
}

/* ---------- هوش مصنوعی ---------- */
function aiOk(){return /^https?:\/\//.test(AI.base||'')&&AI.model}
async function callAI(payload){
  var url=AI.base.replace(/\/+$/,'');if(!/\/chat\/completions$/.test(url))url+='/chat/completions';
  var r;
  if(AI.px!==false){if(!AI.pk||!workerApi())throw new Error('کلید پروکسی یا آدرس ورکر خالی است.');r=await fetch(workerApi()+'/api/aiproxy',{method:'POST',headers:{'Content-Type':'application/json','X-Proxy-Key':AI.pk},body:JSON.stringify({url:url,key:AI.key||'',body:payload})})}
  else{var h={'Content-Type':'application/json'};if(AI.key)h.Authorization='Bearer '+AI.key;r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(payload)})}
  var j=await r.json().catch(function(){return null});
  if(!r.ok)throw new Error((j&&(j.error&&(j.error.message||j.error)||j.message))||('خطای '+r.status));
  var c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(!c)throw new Error('پاسخ هوش مصنوعی خالی بود.');
  return JSON.parse(String(c).replace(/^[\s\S]*?(\{)/,'$1').replace(/\}[^}]*$/,'}'));
}
var SEO_RULES='title جذاب ۲۰ تا ۶۵ حرف؛ seoTitle حداکثر ۶۰ حرف و شامل کلمهٔ کلیدی؛ desc و seoDesc هر کدام ۱۲۰ تا ۱۶۰ حرف، روان، شامل کلمهٔ کلیدی و بدون تکرار کامل عنوان؛ kw یک عبارت اصلی طبیعی ۲ تا ۴ کلمه؛ slug فقط حروف انگلیسی کوچک، عدد و خط تیره، ۳ تا ۶ کلمه و ترجمهٔ مفهوم موضوع؛ tag یک برچسب کوتاه فارسی (مثلاً «آموزش»).';
async function aiMeta(p){
  var o=await callAI({model:AI.model,temperature:.2,messages:[
    {role:'system',content:'تو متخصص سئوی فارسی هستی. عنوان و متن یک مقاله می‌آید. فقط یک JSON معتبر برگردان (بدون توضیح): {"title":"","slug":"","desc":"","tag":"","seoTitle":"","seoDesc":"","kw":""}. متن مقاله را تغییر نمی‌دهی و فقط فیلدهای سئو را می‌سازی. قواعد: '+SEO_RULES},
    {role:'user',content:'عنوان فعلی: '+p.title+'\n\nمتن:\n'+blocksText(p.blocks).slice(0,7000)}]});
  return o;
}
function blocksText(bl){
  return bl.map(function(b){
    if(b.t==='heading')return(b.level===3?'### ':'## ')+b.text;
    if(b.t==='list')return b.text.split('\n').map(function(x){return'- '+x}).join('\n');
    if(b.t==='highlight')return'> '+b.text;
    if(b.t==='image')return'![alt: '+(b.alt||'')+']('+b.src+')'+(b.caption?' توضیح: '+b.caption:'');
    if(b.t==='video'||b.t==='aparat'||b.t==='soundcloud')return b.url;
    if(b.t==='audio')return'صوت: '+b.src;
    if(b.t==='button')return'دکمه: '+b.label+' '+b.href;
    if(b.t==='divider')return'---';
    return b.text||'';
  }).join('\n\n');
}
function linksList(){
  var core=[{title:'فروشگاه',href:'/shop/'},{title:'آرشیو آهنگسازی و تنظیم',href:'/compose/'},{title:'آرشیو میکس و مسترینگ',href:'/mixing/'},{title:'آرشیو آکوردها',href:'/chords/'},{title:'آرشیو نت‌ها',href:'/sheets/'}];
  return core.concat((ST.index||[]).slice(0,50)).filter(function(p){return p.href&&p.title}).map(function(p){return'- '+p.title+' → '+p.href}).join('\n');

    var used=false;(ST.index||[]).forEach(function(x){if(x.href.split('/').filter(Boolean).pop()===o.slug&&!(DONE[p.id]&&DONE[p.id]===x.href))used=true});if(used)return alert('این نشانی قبلاً برای مقالهٔ دیگری استفاده شده؛ آن را تغییر بده.');
    this.disabled=true;
    try{await publishOne(o,p);ST.qi++;stepDecide()}catch(e){log('خطا: '+e.message);this.disabled=false}
  };
}
async function publishOne(o,p){
  var g=GH(),ci=R.catInfo(S,o.cat),href=ci.dir+o.slug+'/',base=ci.dir.slice(1)+o.slug;
  if(!o.updated)o.updated=o.date;
  log('در حال انتشار...');
  await putF(g,base+'/index.html',b64(R.postHtml(S,o)),'import '+o.slug);
  await putF(g,'data/posts/'+o.slug+'.json',b64(JSON.stringify(o,null,1)),'import source '+o.slug);
  ST.index=(ST.index||[]).filter(function(x){return x.href!==href});
  ST.index.push({cat:o.cat,title:o.title,desc:o.desc,img:o.img,tag:o.tag,meta:R.readMin(o),href:href,date:o.date});
  await writeIndex(g,ST.index);
  DONE[p.id]=href;W('SR_IMP_DONE',DONE);
  ST.redirects.push({from:p.link,to:href});
  log('✓ منتشر شد: '+href);
}
function diffHtml(a,b){
  var A=a.split(/(\s+)/).filter(function(x){return x&&!/^\s+$/.test(x)}),B=b.split(/(\s+)/).filter(function(x){return x&&!/^\s+$/.test(x)});
  var legend='<div class="note">مقایسه: <ins style="background:#1f5f3f;text-decoration:none;padding:0 2px">سبز = اضافه‌شده</ins> · <del style="background:#6a2230;padding:0 2px">قرمز = حذف‌شده از اصل</del></div>';
  if(A.length*B.length>9e6)return legend+'<div class="note warn">متن خیلی بلند است؛ مقایسهٔ کلمه‌به‌کلمه ممکن نیست. متن اصلی:</div><textarea readonly style="width:100%;min-height:200px;background:#1b202c;color:#fff;border:2px solid #000;border-radius:9px;padding:8px">'+esc(a)+'</textarea>';
  var n=A.length,m=B.length,W=m+1,L=new Uint16Array((n+1)*W),i,j;
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)L[i*W+j]=A[i]===B[j]?L[(i+1)*W+j+1]+1:Math.max(L[(i+1)*W+j],L[i*W+j+1]);
  var o='';i=0;j=0;
  while(i<n&&j<m){if(A[i]===B[j]){o+=esc(A[i])+' ';i++;j++}else if(L[(i+1)*W+j]>=L[i*W+j+1]){o+='<del style="background:#6a2230">'+esc(A[i])+'</del> ';i++}else{o+='<ins style="background:#1f5f3f;text-decoration:none">'+esc(B[j])+'</ins> ';j++}}
  while(i<n){o+='<del style="background:#6a2230">'+esc(A[i++])+'</del> '}while(j<m){o+='<ins style="background:#1f5f3f;text-decoration:none">'+esc(B[j++])+'</ins> '}
  var same=(a.trim()===b.trim());
  return legend+(same?'<div class="note">متن تغییری نکرده است.</div>':'')+'<div class="box2" style="white-space:pre-wrap;line-height:2.1;max-height:420px;overflow:auto">'+o+'</div>';
}
function oldPath(link){try{var u=new URL(link);return safeDec(u.pathname)}catch(e){return''}}
async function finish(){
  app.onclick=null;app.onchange=null;
  app.innerHTML='<div class="box2"><b>در حال ساخت سایت‌مپ، فهرست‌ها و ریدایرکت‌ها...</b></div>';
  try{
    var g=GH(),posts=await readIndex(g);ST.index=posts;
    await putF(g,'sitemap.xml',b64(pageList(posts)),'import: sitemap');log('✓ sitemap');
    var cats={};posts.forEach(function(x){cats[x.cat]=1});
    for(var c in cats){await putF(g,R.catInfo(S,c).dir.slice(1)+'index.html',b64(R.archivePage(S,c,posts)),'import: archive '+c);log('✓ صفحهٔ دسته '+c,true)}
    await putF(g,'index.html',b64(R.page(S,posts)),'import: home');log('✓ صفحهٔ اصلی',true);
    /* ریدایرکت: از همهٔ مقاله‌های منتقل‌شده (حتی دفعه‌های قبل) */
    var lines=[],seen={};
    ST.posts.forEach(function(p){var h=DONE[p.id];if(!h||!p.link)return;var f=oldPath(p.link);if(!f||f==='/')return;[f,f.replace(/\/$/,'')].forEach(function(a){if(a&&!seen[a]&&a!==h){seen[a]=1;lines.push(a+' '+h+' 301')}})});
    var rf=await getF(g,'_redirects'),old=rf?ub64(rf.content):'',add=lines.filter(function(l){return old.indexOf(l)<0});
    if(add.length)await putF(g,'_redirects',b64((old?old.replace(/\n?$/,'\n'):'')+add.join('\n')+'\n'),'import: redirects');
    app.innerHTML='<div class="box2"><h2>تمام شد ✔</h2><div class="note">'+Object.keys(DONE).length+' مقاله منتقل شده. '+add.length+' خط ریدایرکت به فایل <b>_redirects</b> اضافه شد (روی Cloudflare Pages فعال می‌شود؛ روی گیت‌هاب‌پیجز بی‌اثر است و مشکلی ندارد).</div>'+
    '<div class="note">حدود ۳۰ ثانیه تا ۲ دقیقه بعد در سایت دیده می‌شود. بعد از وصل دامنه: ابزار پست‌ساز ← «انتشار مجدد همهٔ پست‌ها».</div>'+
    (add.length?'<label class="f"><span>خطوط ریدایرکت</span><textarea class="ltr" readonly style="min-height:140px">'+esc(add.join('\n'))+'</textarea></label>':'')+
    '<div class="row"><button class="b" id="again">انتقال مقاله‌های بیشتر</button></div></div>';
    $('again').onclick=function(){stepOrPick()};
  }catch(e){log('خطا: '+e.message);app.innerHTML='<div class="box2"><div class="warn">'+esc(e.message)+'</div><button class="b" id="r2">تلاش دوباره</button></div>';$('r2').onclick=finish}
}

screenSetup();
})();
